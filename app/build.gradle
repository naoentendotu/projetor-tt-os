plugins {
    id 'com.android.application'
}

android {
    namespace 'com.projetoros.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.projetoros.launcher'
        minSdk 24
        // 30 = Android 11 do HY300; acima disso o Android bloqueia o connect/disconnect do Bluetooth usado na troca de saída de áudio
        targetSdk 30
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
